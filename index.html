<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Background Animations | Quadrados Girando</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Evita seleção de texto indesejada */
        }

        body {
            background-color: black;
            min-height: 100vh;
            overflow: hidden; /* Remove rolagem para manter o efeito puro */
            font-family: 'Segoe UI', 'Montserrat', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
            font-weight: 600;
            position: relative;
        }

        /* CANVAS: responsável pelos quadrados animados */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background-color: black;
            z-index: 1;
            pointer-events: none; /* Permite clicar através do canvas, mantendo texto interativo se necessário */
        }

        /* Container central do texto e linhas */
        .center-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            width: 100%;
            pointer-events: none; /* Deixa passar clique, mas não atrapalha a visão */
        }

        /* Linha superior (acima do texto) */
        .line-top {
            width: 90%;
            max-width: 850px;
            height: 3px;
            background-color: white;
            margin: 0 auto 1.5rem auto;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(255,255,255,0.6);
            transition: all 0.2s ease;
        }

        /* Texto principal */
        .main-title {
            font-size: clamp(1.8rem, 8vw, 4rem);
            letter-spacing: 0.08em;
            color: white;
            text-transform: uppercase;
            font-weight: 700;
            background: transparent;
            text-shadow: 0 0 6px rgba(255,255,255,0.3);
            backdrop-filter: blur(0px);
            margin: 0.25rem 0;
            word-break: keep-all;
            white-space: nowrap;
        }

        /* Para telas pequenas: quebra o texto em duas linhas mas mantendo a frase inteira */
        @media (max-width: 680px) {
            .main-title {
                white-space: normal;
                font-size: clamp(1.4rem, 7vw, 2.6rem);
                padding: 0 1rem;
                line-height: 1.3;
            }
            .line-top, .line-bottom {
                width: 75%;
            }
        }

        /* Linha inferior (abaixo do texto) */
        .line-bottom {
            width: 90%;
            max-width: 850px;
            height: 3px;
            background-color: white;
            margin: 1.5rem auto 0 auto;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(255,255,255,0.6);
        }

        /* efeito sutil de pulsação nas linhas opcional (não atrapalha) */
        @keyframes subtlePulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .line-top, .line-bottom {
            animation: subtlePulse 2s infinite alternate ease-in-out;
        }
        
        /* garantia que tudo fique legível e sem overflow */
        html, body {
            width: 100%;
            height: 100%;
            background: black;
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="center-content">
        <div class="line-top"></div>
        <div class="main-title">BACKGROUND ANIMATIONS</div>
        <div class="line-bottom"></div>
    </div>

    <script>
        (function() {
            // --- Configurações principais ---
            const canvas = document.getElementById('canvas-bg');
            const ctx = canvas.getContext('2d');

            // Quadrados: tamanho médio (entre 45px e 80px, mas maioria na faixa média)
            const MIN_SIZE = 42;
            const MAX_SIZE = 80;
            // Velocidade de subida rápida (pixels por segundo)
            const BASE_RISE_SPEED = 180;   // sobe rápido
            // Velocidade de rotação lenta (radianos por segundo)
            const ROTATION_SPEED_RAD = 0.9;   // ~50 graus/segundo, suave e lento
            
            // Quantidade máxima de quadrados ativos para boa performance
            const MAX_SQUARES = 38;
            // Intervalo de spawn (milissegundos) - gera quadrados continuamente
            const SPAWN_INTERVAL_MS = 420;
            
            // Parâmetros de fade gradativo (transparência aumenta conforme sobe)
            // O quadrado some completamente ao atingir o topo (y - size/2 <= 0)
            
            let squares = [];
            let animationId = null;
            let lastTimestamp = 0;
            let lastSpawnTime = 0;
            
            // Dimensões do canvas dinâmicas
            let canvasWidth = window.innerWidth;
            let canvasHeight = window.innerHeight;
            
            // ---------- Classe Quadrado com rotação lenta e subida rápida ----------
            class RisingSquare {
                constructor(x, y, size, angle, rotationSpeed) {
                    this.x = x;               // centro x
                    this.y = y;               // centro y (começa na base ou abaixo)
                    this.size = size;         // largura/altura do quadrado
                    this.angle = angle;       // ângulo atual em radianos
                    this.rotationSpeed = rotationSpeed; // rad/s (lento)
                    this.riseSpeed = BASE_RISE_SPEED;   // pixels/segundo (rápido)
                }
                
                // Atualiza posição e rotação baseado no delta de tempo (segundos)
                update(deltaSec) {
                    // SOBE RÁPIDO: diminui Y (para cima)
                    this.y -= this.riseSpeed * deltaSec;
                    // ROTAÇÃO LENTA: incrementa ângulo
                    this.angle += this.rotationSpeed * deltaSec;
                    // manter ângulo dentro de 0 a 2PI (opcional, apenas para evitar overflow)
                    if (this.angle > Math.PI * 2) this.angle -= Math.PI * 2;
                    return this; 
                }
                
                // Verifica se o quadrado ainda está visível (não sumiu completamente)
                // Critério de desaparecimento: quando a parte inferior? Na verdade, queremos que suma gradativamente até o topo.
                // Mas ao atingir o ponto onde o quadrado inteiro sai da tela (topo: y + size/2 < 0), removemos.
                // Contudo o efeito pede "somem gradativamente até o superior da tela". Durante o trajeto, aplicamos fade alfa.
                // Remoção final quando topo do quadrado (y - size/2) > canvasHeight? NÃO, porque sobe.
                // Remover quando a parte inferior do quadrado passar do topo: y + size/2 <= 0
                isAlive() {
                    // se o quadrado ainda não passou completamente do topo (borda inferior do quadrado ainda tem algum pixel na tela)
                    // mas se já está totalmente acima da tela (y + size/2 <= 0), removemos.
                    return (this.y + this.size / 2) > 0;
                }
                
                // Retorna o fator de opacidade baseado na posição Y (quanto mais perto do topo, mais transparente)
                // Começa com opacidade máxima (1) na base e vai até 0 quando atinge o topo (y - size/2 <= 0).
                // Gradiente suave: Quanto menor Y, mais fade.
                getAlpha() {
                    // y vai desde a parte inferior (canvasHeight + alguma margem) até 0 - size/2
                    // Calculamos o progresso baseado na altura do canvas: 
                    // Consideramos que o fade começa a intensificar quando o quadrado passa do meio para o topo.
                    // Mas para efeito "somem gradativamente até o superior", faremos alpha linear entre a posição inicial até o topo.
                    const topEdge = this.y - this.size / 2;   // coordenada Y do topo do quadrado
                    const bottomEdge = this.y + this.size / 2;
                    
                    // O quadrado nasce na base ou um pouco abaixo do canvas (y >= canvasHeight + offset)
                    // e termina no topo (topEdge <= 0). Mapeamos alpha de 1 (perto da base ou no início da tela) 
                    // até 0 (quando topEdge <= 0).
                    // Porém para suavidade e desaparecimento gradual ao longo de toda subida, usamos interpolação baseada em Y.
                    // Quanto mais próximo do topo, menor o alpha. 
                    // Usar referência: início de fade quando o centro y está acima de 60% da altura? Não, melhor fazer progresso total:
                    // O valor máximo de Y inicial é próximo a canvasHeight + size, e mínimo é -size/2.
                    let t = 1.0;
                    // A zona de transição total: desde Y_start até Y_end (topo invisível)
                    const yStartFade = canvasHeight * 0.7;   // a partir dos 70% da tela começa a perder opacidade mais rápido? 
                    // Queremos que desapareça exatamente antes de sumir, mas com aspecto de esmaecimento.
                    // Precisão artística: define Alpha = 1 quando y > canvasHeight * 0.4 (parte inferior),
                    // linear para 0 quando y <= 0.
                    let alpha = 1;
                    const maxY = canvasHeight + this.size;   // região original onde spawna
                    const minY = 0 - this.size/2;             // topo sumido
                    // mapear confiavelmente: alpha = (y - minY) / (maxY - minY) mas invertido? Queremos alpha 1 na base e 0 no topo.
                    if (maxY > minY) {
                        let progress = (this.y - minY) / (maxY - minY);
                        progress = Math.min(1.0, Math.max(0.0, progress));
                        // progress = 1 quando está na base (y grande), e 0 quando está no topo
                        alpha = progress;
                    }
                    // Suaviza um pouco, mas mantém fade total quando está saindo.
                    // Limitar entre 0 e 1
                    return Math.min(0.98, Math.max(0, alpha));
                }
                
                // Desenha o quadrado com rotação e transparência baseada na altura
                draw(ctx) {
                    const alpha = this.getAlpha();
                    if (alpha <= 0.01) return; // completamente invisível não desenha
                    
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = 'white';
                    ctx.shadowBlur = 0; // sem sombra para manter clean e performance, mas pode adicionar leve brilho
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                    // Adiciona um leve glow ou borda sutil? Não necessário, apenas quadrado branco puro
                    ctx.restore();
                }
            }
            
            // ----- Função para criar um novo quadrado com características aleatórias (tamanho médio) -----
            function createSquare(currentTimeMs = null) {
                // Tamanho médio intencional: distribuição entre 48 e 74 píxels (foco em médio)
                const size = Math.floor(Math.random() * (MAX_SIZE - MIN_SIZE + 1) + MIN_SIZE);
                // Posição X aleatória dentro das margens (com borda para não cortar abruptamente)
                const x = Math.random() * (canvasWidth - size) + size/2;
                // Posição inicial Y: surge por debaixo do inferior da tela (base + um pequeno offset)
                // Para dar sensação de "vindo de baixo", y começa pelo menos canvasHeight + size/2 até canvasHeight + size + 30px
                const spawnYBottom = canvasHeight + (size * 0.8) + (Math.random() * 40);
                const y = spawnYBottom;
                
                // Ângulo inicial aleatório (entre 0 e 2PI)
                const angle = Math.random() * Math.PI * 2;
                // Velocidade de rotação lenta (entre 0.5 e 1.2 rad/s) mas garantindo lentidão
                const rotSpeed = 0.6 + Math.random() * 0.7;  // ~0.6 a 1.3 rad/s ~ 34°/s a 74°/s (todos lentos)
                // Fixamos bem abaixo de valores bruscos
                
                return new RisingSquare(x, y, size, angle, rotSpeed);
            }
            
            // ---- Gerenciar spawn contínuo baseado em intervalo de tempo real ----
            function trySpawnSquare(nowSeconds) {
                if (squares.length < MAX_SQUARES) {
                    const newSquare = createSquare();
                    squares.push(newSquare);
                } else {
                    // se atingiu o máximo, tenta substituir um quadrado antigo ou simplesmente não spawna
                    // mas para manter fluxo contínuo, podemos remover o mais antigo? não é necessário,
                    // apenas aguardar a remoção natural; como a subida é rápida, rapidamente libera espaço.
                    // Entretanto, se por algum motivo permanecer lotado, force remoção de inativos nos updates.
                }
            }
            
            // ---- Atualiza todos os quadrados: movimento e remoção dos que saíram ----
            function updateSquares(deltaSec) {
                // Atualizar cada quadrado
                for (let i = 0; i < squares.length; i++) {
                    squares[i].update(deltaSec);
                }
                // Filtrar os que ainda estão vivos (isAlive com base em saída total do topo)
                squares = squares.filter(sq => sq.isAlive());
            }
            
            // ----- Desenha todos os quadrados com seus respectivos fades e rotações -----
            function drawSquares() {
                for (let sq of squares) {
                    sq.draw(ctx);
                }
            }
            
            // ----- Loop principal de animação (requestAnimationFrame) -----
            let previousTime = null;
            
            function animate(currentTimeMs) {
                if (!canvas || !ctx) return;
                
                // Converte para segundos
                const currentSec = currentTimeMs / 1000;
                
                if (previousTime === null) {
                    previousTime = currentSec;
                    requestAnimationFrame(animate);
                    return;
                }
                
                let deltaSec = Math.min(0.033, currentSec - previousTime); // limitar delta máximo para evitar saltos grandes
                if (deltaSec <= 0) {
                    previousTime = currentSec;
                    requestAnimationFrame(animate);
                    return;
                }
                
                // --- Spawn baseado em tempo real (cria quadrados a cada intervalo) ---
                if (lastSpawnTime === 0) lastSpawnTime = currentSec;
                const timeSinceLastSpawn = currentSec - lastSpawnTime;
                if (timeSinceLastSpawn >= (SPAWN_INTERVAL_MS / 1000)) {
                    trySpawnSquare(currentSec);
                    lastSpawnTime = currentSec;
                    // pequeno ajuste para múltiplos spawns caso delta grande, mas seguro:
                    // apenas um spawn por ciclo
                }
                
                // Atualizar posições e rotações dos quadrados
                updateSquares(deltaSec);
                
                // Limpar canvas com fundo preto total
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                
                // Desenhar todos os quadrados brancos com rotação e fade gradiente
                drawSquares();
                
                previousTime = currentSec;
                animationId = requestAnimationFrame(animate);
            }
            
            // ----- Ajustar tamanho do canvas quando a janela for redimensionada -----
            function resizeCanvas() {
                canvasWidth = window.innerWidth;
                canvasHeight = window.innerHeight;
                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
                
                // Ao redimensionar, precisamos evitar que os quadrados fiquem fora de contexto
                // Mas vamos manter os quadrados existentes, apenas garantir que spawn futuro use novas dimensões.
                // Opcionalmente, poderíamos remover quadrados que ficaram muito deslocados, mas não necessário.
                // Recomendo apenas reajustar os quadrados que estejam com X muito além? Para ficar orgânico,
                // se X > nova largura ou X < 0, removemos? não é essencial. Para manter integridade, 
                // filtramos quadrados com X fora da tela mais tamanho? Mas farei leve ajuste:
                for (let i=0; i<squares.length; i++) {
                    const sq = squares[i];
                    // Se após redimensionamento o quadrado estiver extremamente fora do eixo X, removemos (opcional)
                    if (sq.x + sq.size/2 < 0 || sq.x - sq.size/2 > canvasWidth) {
                        squares.splice(i,1);
                        i--;
                    }
                }
                // Redesenho imediato opcional (o próximo frame ajusta)
            }
            
            // Inicializar alguns quadrados para não começar vazio
            function populateInitialSquares(count = 12) {
                for (let i = 0; i < count; i++) {
                    const size = Math.floor(Math.random() * (MAX_SIZE - MIN_SIZE + 1) + MIN_SIZE);
                    const x = Math.random() * canvasWidth;
                    // spawna em diferentes alturas já dentro da tela (mas queremos efeito contínuo) 
                    // Para não poluir, apenas fará alguns partindo do meio pra baixo também
                    const y = canvasHeight - size/2 - Math.random() * (canvasHeight * 0.3);
                    const angle = Math.random() * Math.PI * 2;
                    const rotSpeed = 0.6 + Math.random() * 0.8;
                    const sq = new RisingSquare(x, y, size, angle, rotSpeed);
                    squares.push(sq);
                }
            }
            
            // ---- eventos ----
            window.addEventListener('resize', () => {
                resizeCanvas();
            });
            
            // função de inicialização completa
            function init() {
                resizeCanvas();
                // popula alguns quadrados para animação já iniciar com movimento
                populateInitialSquares(10);
                // começamos o loop
                previousTime = null;
                lastSpawnTime = 0;
                animationId = requestAnimationFrame(animate);
            }
            
            init();
            
            // fallback: garantir que o canvas fique sempre sobre fundo preto e sem interrupção
        })();
    </script>
</body>
</html>
